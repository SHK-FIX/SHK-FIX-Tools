<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2b4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>SHK FIX – Abwasser-Aufmaß</title>
  <link rel="manifest" href="manifest.json?v=10" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" id="brandHome" role="button" tabindex="0" aria-label="Zur Hauptseite"><span>SHK</span> <strong>FIX</strong></div>
      <div class="subtitle">Abwasser-Aufmaß</div>
      <button id="homeBtn" class="icon-btn" aria-label="Hauptseite">⌂</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>
  </div>

  <template id="screen-project">
    <section>
      <div class="eyebrow">Neues Aufmaß</div>
      <h1>Projektdaten</h1>
      <p class="lead">Nur das Nötige eintragen. Der Rest kann später ergänzt werden.</p>
      <div class="card form-grid">
        <label>Objekt<input id="object" placeholder="z. B. Musterstraße 12" /></label>
        <label>Wohnung / Bereich<input id="unit" placeholder="z. B. WE 03 / EG" /></label>
        <label>Auftragsnummer<input id="orderNo" placeholder="optional" /></label>
        <label>Bearbeiter<input id="worker" value="Max" /></label>
      </div>
      <button class="primary full" data-action="start">Aufmaß starten</button>
    </section>
  </template>

  <script src="photo-store.js?v=10"></script>
  <script src="app.js?v=10"></script>
  <script src="pdf-unicode.js?v=10"></script>
  <script src="photo-ui.js?v=10"></script>
  <script src="pdf-photos.js?v=10"></script>
  <script src="workflow-v4.js?v=10"></script>
  <script>
    document.getElementById('homeBtn').addEventListener('click',()=>window.SHKWorkflowV4?.renderHome());
  </script>
</body>
</html>
